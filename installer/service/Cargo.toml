[package]
name = "gnx-app-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
ctrlc = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
windows-service = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
