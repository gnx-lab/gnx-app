name: Publicar GnX Docs en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Validar fuente docs-only
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.md
          test -f docs/_config.yml
          test -f docs/_layouts/default.html
          test -f docs/_data/navigation.yml
          test -f docs/assets/docs.css
          test -f docs/documentation-audit.md
          if rg -n --hidden --glob '!_site/**' '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|api[_-]?key[[:space:]]*[:=])' docs; then
            echo 'Se detectó un patrón que podría ser un secreto en docs.' >&2
            exit 1
          fi

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Renderizar Markdown con Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: _site

      - name: Validar enlaces internos
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node .github/scripts/check-doc-links.mjs _site

      - name: Comprobar artefacto sin runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          if find _site -type f \( \
            -name 'app.js' -o -name 'sw.js' -o -name 'manifest.webmanifest' \
            -o -name '*.msi' -o -name '*.exe' -o -name '*.dll' \
          \) -print -quit | grep -q .; then
            echo 'El artefacto de documentación contiene runtime o instalables.' >&2
            exit 1
          fi

      - name: Crear artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar documentación
        id: deployment
        uses: actions/deploy-pages@v4
